project:
  name: Ertip Report App
  type: private-management-reporting-web-app
  primary_language: tr
  repository_visibility: private
  deployment_platform: coolify
  mvp_status: complete
  mvp_closed_at: 2026-07-26
  current_phase: post_mvp_m5

source_system:
  product: Odoo Online
  plan: Custom
  detected_version: 19.0+e
  database_count: 1
  company_count: 2
  access_mode: read_only_external_api
  preferred_api:
    odoo_19_plus: json2
    older_versions: version_appropriate_rpc_adapter
  verified_model_counts:
    sale_order: 6875
  verified_custom_fields:
    sale_order: 0

users:
  expected_scale: small
  roles:
    owner:
      can_manage_connections: true
      can_manage_reports: true
      can_manage_users: true
      can_view_all_scopes: true
    manager:
      can_manage_connections: false
      can_manage_reports: false
      can_run_published_reports: true
      can_export_reports: true
  employee_access: false

organization:
  application_concept: business_unit
  source_mapping: odoo_res_company_id
  initial_units:
    - Yurt Dışı
    - Yurt İçi
  verified_mapping:
    yurt_disi:
      odoo_company_id: 1
      source_currency_code: USD
      source_currency_id: 1
    yurt_ici:
      odoo_company_id: 25
      source_currency_code: TRY
      source_currency_id: 31
  mapping_rule: stable_company_id_only

reporting_semantics:
  quotation_cohort_field: sale.order.create_date
  confirmation_period_field: sale.order.date_order
  source_states:
    open:
      - draft
      - sent
    realized:
      - sale
    cancelled:
      - cancel
  quotation_date_live_evidence:
    confirmed_sample_count: 100
    date_order_after_create_count: 55
    cross_month_count: 4
    maximum_observed_lag_days: 147.86

product_scope:
  first_report: international_monthly_quotation_performance
  report_modes:
    - general
    - salesperson
    - customer
  exports:
    - print
    - pdf
    - xlsx
  owner_report_builder:
    phase: later
    audience: owner_only
  post_mvp_next:
    - salesperson_performance
    - customer_quotation_history
    - open_and_aging_quotations
    - quotation_to_order_conversion

architecture:
  style: modular_monolith_with_worker
  web: nextjs
  language: typescript
  database: postgresql
  cache_queue: redis
  worker: background_sync_and_exports
  reporting_source: local_reporting_database
  direct_browser_to_odoo: forbidden

ui:
  direction: executive_intelligence
  desktop_first: true
  responsive: true
  themes:
    - dark
    - light
  characteristics:
    - professional
    - premium
    - expressive_but_controlled
    - easy_to_understand
    - print_friendly

deployment:
  environments:
    staging:
      branch: develop
      auto_deploy: true
    production:
      branch: main
      auto_deploy: true
  required_ci_checks:
    - format
    - lint
    - typecheck
    - unit
    - integration
    - build
    - browser_smoke
  operational_rehearsals:
    backup_restore:
      mode: isolated_ci
      status: passed
      workflow: m4-operations-rehearsal
    rollback_compatibility:
      mode: isolated_ci
      status: passed
      previous_verified_commit: 71f5dd857cc3994aaa5e66e3b8849a5fd2f2f6c6
  production_backup_policy:
    frequency: daily
    off_server_encrypted_copy: required
    scheduler_verification: external_operations_responsibility

security:
  odoo_api_key_client_exposure: forbidden
  source_access: read_only
  secrets_location: runtime_environment
  audit_logging: required
  business_unit_scope_enforcement: server_side
