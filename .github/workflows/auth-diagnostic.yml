name: Auth Browser Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  auth-browser-diagnostic:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://ertip:ertip@127.0.0.1:5432/ertip_report
      DATABASE_SSL: 'false'
    steps:
      - name: Run focused auth browser test
        run: |
          docker run --detach --rm --name ertip-auth-postgres \
            --publish 5432:5432 \
            --env POSTGRES_USER=ertip \
            --env POSTGRES_PASSWORD=ertip \
            --env POSTGRES_DB=ertip_report \
            postgres:17-alpine >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec ertip-auth-postgres pg_isready -U ertip -d ertip_report >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          git clone --quiet --depth 1 --branch feature/m1-auth-database "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source
          cd source
          corepack enable
          corepack prepare pnpm@11.4.0 --activate >/dev/null
          pnpm install --no-frozen-lockfile --reporter=silent
          pnpm exec playwright install --with-deps chromium >/dev/null 2>&1
          pnpm build >/dev/null 2>&1
          pnpm exec playwright test --config apps/web/playwright.auth.config.ts --reporter=line --workers=1
