name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  APP_ENV: test
  APP_DEMO_MODE: true
  ODOO_BASE_URL: https://ertipmedical.odoo.com
  ODOO_DATABASE: ertipmedical
  ODOO_API_KEY: ''

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: package.json
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: package.json
      - run: pnpm install --no-frozen-lockfile
      - id: lint
        continue-on-error: true
        run: pnpm lint > lint.log 2>&1
      - if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint.log
          retention-days: 3
      - if: steps.lint.outcome == 'failure'
        run: |
          cat lint.log
          exit 1

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: package.json
      - run: pnpm install --no-frozen-lockfile
      - id: typecheck
        continue-on-error: true
        run: pnpm typecheck > typecheck.log 2>&1
      - if: steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          retention-days: 3
      - if: steps.typecheck.outcome == 'failure'
        run: |
          cat typecheck.log
          exit 1

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: package.json
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm unit

  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ertip
          POSTGRES_PASSWORD: ertip
          POSTGRES_DB: ertip_report
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ertip -d ertip_report"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ertip:ertip@127.0.0.1:5432/ertip_report
      DATABASE_SSL: 'false'
      SESSION_SECRET: integration-session-secret-value-2026
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: package.json
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm integration

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: package.json
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: docker build --tag ertip-report-app:ci .
      - run: docker build --file Dockerfile.worker --tag ertip-report-worker:ci .
      - name: Smoke-test worker production image
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f ertip-worker-start-smoke ertip-worker-retry-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --read-only --tmpfs /tmp:rw,nosuid,size=64m \
            --name ertip-worker-start-smoke \
            -e APP_ENV=test \
            -e APP_DEMO_MODE=true \
            ertip-report-worker:ci
          sleep 3
          test "$(docker inspect --format '{{.State.Running}}' ertip-worker-start-smoke)" = "true"
          docker logs ertip-worker-start-smoke 2>&1 | tee worker-start-smoke.log
          grep -q '"event":"worker.started"' worker-start-smoke.log
          ! grep -q 'Corepack is about to download' worker-start-smoke.log
          ! grep -Eq 'pnpm.*install --production' worker-start-smoke.log

          docker run --detach --read-only --tmpfs /tmp:rw,nosuid,size=64m \
            --name ertip-worker-retry-smoke \
            -e APP_ENV=test \
            -e APP_DEMO_MODE=true \
            -e DATABASE_URL=postgresql://ertip:ertip@127.0.0.1:1/unreachable \
            -e DATABASE_SSL=false \
            ertip-report-worker:ci
          sleep 4
          test "$(docker inspect --format '{{.State.Running}}' ertip-worker-retry-smoke)" = "true"
          docker logs ertip-worker-retry-smoke 2>&1 | tee worker-retry-smoke.log
          grep -q '"event":"worker.database.retry"' worker-retry-smoke.log
          ! grep -q 'Corepack is about to download' worker-retry-smoke.log
          ! grep -Eq 'pnpm.*install --production' worker-retry-smoke.log

  browser-smoke:
    name: browser_smoke
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ertip
          POSTGRES_PASSWORD: ertip
          POSTGRES_DB: ertip_report
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ertip -d ertip_report"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ertip:ertip@127.0.0.1:5432/ertip_report
      DATABASE_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: package.json
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm browser:smoke
      - run: pnpm browser:auth
